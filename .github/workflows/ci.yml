name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install Chefe
        run: |
          uv tool install "chefe>=0.0.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache the environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.pixi
            ~/.cache/rattler
            .chefe/.pixi
          key: chefe-${{ runner.os }}-${{ hashFiles('chefe.toml', 'pyproject.toml') }}
      - run: chefe install --resolve
      - run: chefe run lint
      - run: chefe run typecheck
      - run: chefe run test
      - run: chefe run build
