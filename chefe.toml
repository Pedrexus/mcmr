[workspace]
name = "mcmr"
platforms = ["linux-64"]
channels = ["conda-forge"]

[deps]
nodejs = ">=26.3,<26.4"
pnpm = ">=11.7,<12"
python-freethreading = ">=3.14.6,<3.15"
rust = ">=1.96,<1.97"

[python.deps]
anyio = ">=4.14,<5"
cyclopts = ">=4.21,<5"
mcmr = { path = ".", editable = true }
pydantic = ">=2.13,<3"
rich = ">=14,<16"

[dev.python.deps]
build = ">=1.3,<2"
hypothesis = ">=6.155,<7"
pylint = ">=4,<5"
mypy = ">=2.3,<3"
pyrefly = ">=1.1,<2"
pytest = ">=9.1,<10"
pytest-cov = ">=7.1,<8"
ruff = ">=0.15,<0.16"
ty = ">=0.0.61,<0.1"

[dev.deps]
clang-tools = ">=22.1,<23"

[nodejs]
manager = "pnpm"

[nodejs.dev.deps]
eslint = "^10.8.0"
typescript-eslint = "^8.65.0"

[tasks]
format = "ruff format . && ruff check --fix ."
setup = "cargo build --release --manifest-path kernel/Cargo.toml"
kernel = "cargo build --release --manifest-path kernel/Cargo.toml"
kernel-format = "cargo fmt --manifest-path kernel/Cargo.toml"
kernel-test = "cargo test --manifest-path kernel/Cargo.toml"
kernel-bench = "cargo bench --manifest-path kernel/Cargo.toml"
kernel-lint = "cargo clippy --manifest-path kernel/Cargo.toml -- -D warnings && cargo fmt --manifest-path kernel/Cargo.toml --check"
check = "python -m mcmr.cli check"
lint = "ruff check . && ruff format --check ."
typecheck = "mypy src && pyrefly check && ty check --error-on-warning"
test = "python -m pytest"
floor = "python -m mcmr.cli floor --samples 9 --output .benchmarks/mock-floor.json"
build = "python -m build --outdir .dist"
