[package]
name = "mcmr-kernel"
version = "0.0.1"
edition = "2024"
description = "Discovery, parsing, and fact extraction for My Code, My Rules"
license = "Apache-2.0"

[lib]
name = "mcmr_kernel"
path = "src/lib.rs"

[[bin]]
name = "mcmr-kernel"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ruff_python_ast = "0.0.6"
ruff_python_parser = "0.0.6"
ruff_source_file = "0.0.6"
ruff_text_size = "0.0.6"
serde = { version = "1", features = ["derive"] }
oxc_allocator = "0.141"
oxc_ast = "0.141"
oxc_ast_visit = "0.141"
oxc_parser = "0.141"
oxc_span = "0.141"
oxc_syntax = "0.141"
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "1.1.3"
walkdir = "2"
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-cuda = "0.21.1"
rayon = "1.12.0"

[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "kernel"
harness = false
