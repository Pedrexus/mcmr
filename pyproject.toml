[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "mcmr-api"
version = "0.0.1"
description = "Define and enforce the engineering rules that make your code yours."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "lint",
  "rules",
  "static-analysis",
  "mcmr",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "annotated-types>=0.8,<1",
  "anyio>=4.14,<5",
  "cyclopts>=4",
  "httpx>=0.28,<1",
  "packaging>=26,<27",
  "patos>=0.0.9,<0.1",
  "pathspec>=1.1,<2",
  "polars>=1.41,<2",
  "pydantic>=2.13,<3",
  "rich>=14,<16",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "ty>=0.0.61,<0.1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "faker>=30",
  "dirty-equals>=0.8",
]
[project.scripts]
mcmr = "mcmr.commands.cli:app"

[project.entry-points."mcmr.providers"]
dependencies = "mcmr.project.dependencies:DependencyRefresher"

[project.urls]
Homepage = "https://phvv.me/mcmr"
Documentation = "https://phvv.me/mcmr"
Repository = "https://github.com/phvv-me/mcmr"
Issues = "https://github.com/phvv-me/mcmr/issues"

[tool.maturin]
features = ["extension-module"]
manifest-path = "src/core/Cargo.toml"
module-name = "mcmr.kernel_tables"
python-source = "src/api"

[tool.ruff]
line-length = 99
namespace-packages = ["src/rules/mcmr"]
src = ["src/api", "src/rules"]
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "SIM", "TC", "UP"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["mcmr.domain.contracts", "pathlib"]
runtime-evaluated-base-classes = [
  "mcmr.execution.backends.batched.BatchedBackend",
  "mcmr.execution.queries.runtime.ClassificationBackend",
  "patos.Component",
  "patos.FrozenFlexModel",
  "patos.FrozenModel",
]
runtime-evaluated-decorators = [
  "cyclopts.App.command",
  "hypothesis.given",
  "mcmr.commands.interface.app.command",
  "mcmr.rule",
  "mcmr.declaration.decorators.rule",
  "mcmr.domain.contracts.Rule.fix",
]

[tool.pyrefly]
project-includes = ["src/api", "src/rules", "tests"]
search-path = ["src/api", "src/rules", "."]
python-version = "3.14"
python-interpreter-path = ".chefe/.pixi/envs/default/bin/python"

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
explicit_package_bases = true
files = ["src/api", "src/rules"]
mypy_path = ["src/api", "src/rules"]
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true

[tool.ty.environment]
python = ".chefe/.pixi/envs/default"
python-version = "3.14"
root = ["src/api", "src/rules"]

[tool.ty.src]
include = ["src/api", "src/rules"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict --import-mode=importlib --cov=mcmr --cov=mcmr_datahub --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcmr", "mcmr_datahub"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  'raise NotImplementedError\("planned rule"\)',
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.$",
]

[tool.mcmr]

[tool.mcmr.contextual]
backend = "codex"
model = "gpt-5.6-terra"
reasoning_effort = "medium"

[tool.mcmr.rules.ALL-FILE0002]
framework_roots = ["src/rules/mcmr/rules"]
