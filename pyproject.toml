[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcmr"
version = "0.0.1"
description = "Define and enforce the engineering rules that make your code yours."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "lint",
  "rules",
  "static-analysis",
  "mcmr",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "anyio>=4.14,<5",
  "cyclopts>=4",
  "pydantic>=2.13,<3",
  "rich>=14,<16",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "ty>=0.0.61,<0.1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "faker>=30",
  "dirty-equals>=0.8",
]
[project.scripts]
mcmr = "mcmr.cli:app"

[project.urls]
Homepage = "https://phvv.me/mcmr"
Documentation = "https://phvv.me/mcmr"
Repository = "https://github.com/phvv-me/mcmr"
Issues = "https://github.com/phvv-me/mcmr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmr"]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "SIM", "TC", "UP"]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["mcmr.models"]
runtime-evaluated-base-classes = ["mcmr.bases.FrozenFlexModel"]
runtime-evaluated-decorators = [
  "cyclopts.App.command",
  "mcmr.rule",
  "mcmr.decorators.rule",
  "mcmr.models.Rule.fix",
]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.14"
python-interpreter-path = ".chefe/.pixi/envs/default/bin/python"

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
files = ["src"]
mypy_path = "src"
namespace_packages = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true

[tool.ty.environment]
python = ".chefe/.pixi/envs/default"
python-version = "3.14"
root = ["src"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers --cov=mcmr --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcmr"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  'raise NotImplementedError\("planned rule"\)',
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.$",
]
