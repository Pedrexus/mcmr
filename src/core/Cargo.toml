[package]
name = "mcmr-native"
version = "0.0.1"
edition = "2024"
description = "Native analysis and typed Python tables for My Code, My Rules"
license = "Apache-2.0"

[lib]
name = "kernel_tables"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mcmr-kernel"
path = "src/main.rs"

[features]
default = []
extension-module = ["python", "pyo3/extension-module"]
python = ["dep:gliner2", "dep:polars", "dep:pyo3", "dep:pyo3-polars"]

[dependencies]
gliner2 = { version = "0.1.2", optional = true }
ignore = "0.4"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
oxc_allocator = "0.141"
oxc_ast = "0.141"
oxc_ast_visit = "0.141"
oxc_parser = "0.141"
oxc_span = "0.141"
oxc_syntax = "0.141"
path-slash = "0.2.1"
polars = { version = "0.54.4", default-features = false, optional = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.28", optional = true }
pyo3-polars = { version = "0.27", optional = true }
rayon = "1.12.0"
ruff_python_ast = "0.0.6"
ruff_python_parser = "0.0.6"
ruff_source_file = "0.0.6"
ruff_text_size = "0.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
tempfile = "3"
textwrap = "0.16"
toml = "1.1.3"
walkdir = "2"
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-cuda = "0.21.1"

[profile.release]
codegen-units = 1
lto = "thin"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "kernel"
harness = false
